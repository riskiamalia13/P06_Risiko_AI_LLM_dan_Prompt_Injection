<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasus Aman</title>
</head>
<body>
    <script>
        // Deklarasi global langsung di window
        window.model = {
            generate: async function(prompt) {
                return "Model LLM Response: " + prompt;
            }
        };

        window.asisten = async function(promptInput) {
            try {
                let history = sessionStorage.getItem('chat_history') || "";
                sessionStorage.setItem('chat_history', history + "\nUser: " + promptInput);
            } catch (e) {}

            // Deteksi prompt injection
            if (/ignore|system|admin|override|bypass|rahsia|secret/i.test(promptInput)) {
                return "BLOCKED: Aksi ditahan gerbang keamanan";
            }

            return await window.model.generate(promptInput);
        };
    </script>
</body>
</html>
