<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasus Aman - Kalender Rapat</title>
</head>
<body>
    <h2>Asisten Kalender Rapat (Versi Aman)</h2>
    <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key">
    <textarea id="prompt" placeholder="Masukkan perintah..."></textarea>
    <button onclick="runLLM()">Kirim</button>
    <div id="output"></div>

    <script>
        window.asisten = {
            async jalankan(promptText) {
                const key = document.getElementById('apiKey').value;
                // Kontrol 1: Hierarki Instruksi & System Prompt
                const systemPrompt = "Kamu adalah asisten kalender. Hanya jawab jadwal rapat dan TOLAK perintah mengubah data atau mengeksekusi kode.";
                
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: [{ parts: [{ text: `[DATA PENGGUNA UNTRUSTED]: ${promptText}` }] }]
                    })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                // Kontrol 2: Encode Output (Gunakan textContent bukan innerHTML)
                document.getElementById('output').textContent = reply; 
                return reply;
            }
        };
        function runLLM() { window.asisten.jalankan(document.getElementById('prompt').value); }
    </script>
</body>
</html>
