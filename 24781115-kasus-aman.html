<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasus Aman</title>
</head>
<body>
    <script>
        // Panggilan model yang disimulasikan
        window.model = {
            generate: async function(prompt) {
                return "Balasan AI Aman: " + prompt;
            }
        };

        window.asisten = async function(promptInput) {
            let history = "";
            try {
                history = sessionStorage.getItem('chat_history') || "";
                sessionStorage.setItem('chat_history', history + "\nUser: " + promptInput);
            } catch (e) {
                console.error(e);
            }

            // Gerbang kontrol keamanan (menahan aksi jika ada prompt injection)
            const isInjection = /ignore|system|admin|override|bypass|drop/i.test(promptInput);
            if (isInjection) {
                return "Akses ditolak: Potensi prompt injection terdeteksi.";
            }

            // Hanya memanggil model jika lolos gerbang pemeriksaan
            let response = await window.model.generate(promptInput);
            return response;
        };
    </script>
</body>
</html>
