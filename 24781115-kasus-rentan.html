<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasus Rentan - Prompt Injection</title>
</head>
<body>
    <h2>Asisten AI (Versi Rentan)</h2>
    <input type="text" id="userInput" placeholder="Ketik pesan...">
    <button onclick="kirimPesan()">Kirim</button>
    <div id="output"></div>

    <script>
        // Fungsi utama yang dipanggil oleh pemeriksa otomatis
        window.asisten = async function(promptInput) {
            try {
                let history = sessionStorage.getItem('chat_history') || "";
                sessionStorage.setItem('chat_history', history + "\nUser: " + promptInput);
            } catch (e) {
                console.error("SessionStorage Error:", e);
            }

            // Simulasi balasan model LLM tanpa enkapsulasi/filter (rentan injection)
            return "Model LLM Response: " + promptInput;
        };

        // Fungsi pendukung UI web
        async function kirimPesan() {
            let input = document.getElementById('userInput').value;
            let response = await window.asisten(input);
            document.getElementById('output').innerText = response;
        }
    </script>
</body>
</html>
